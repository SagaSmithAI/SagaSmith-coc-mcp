name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SagaSmithAI/sagasmith-core
          path: deps/sagasmith-core
      - uses: actions/checkout@v4
        with:
          repository: SagaSmithAI/sagasmith-coc
          path: deps/sagasmith-coc
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e "./deps/sagasmith-core[documents]"
      - run: python -m pip install -e ./deps/sagasmith-coc
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest
