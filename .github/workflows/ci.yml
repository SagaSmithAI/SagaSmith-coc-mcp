name: Archive notice

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify archive redirect
        shell: bash
        run: |
          grep -Fq "This repository is archived" README.md
          grep -Fq "SagaSmithAI/Sagasmith-coc/tree/main/packages/mcp" README.md
